<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery</title>
  <meta name="description" content="A gallery of my paintings.">
  <meta name="theme-color" content="#d0182f">
  <meta name="color-scheme" content="only light">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;800;900&family=JetBrains+Mono:wght@500&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="has-curtain">

  <!-- Intro: a red sheet you cut open -->
  <div class="curtain" id="curtain">
    <div class="c-top">
      <p class="wordmark" aria-hidden="true"><span class="fit">Gallery</span></p>
      <div class="c-bar">
        <span class="mono c-count" id="c-count" aria-hidden="true">000</span>
        <button class="mono c-cut" id="c-cut" type="button">
          <span>Cut along line</span>
          <span class="c-chev" aria-hidden="true">
            <svg viewBox="0 0 30 10"><path d="M0 0l7 5-7 5zM11 0l7 5-7 5zM22 0l7 5-7 5z"/></svg>
          </span>
        </button>
      </div>
      <div class="c-line" id="c-line" aria-hidden="true">
        <span class="c-solid"></span>
        <svg class="scissors" viewBox="0 0 64 40">
          <g class="blade blade-a"><circle cx="9" cy="9" r="6.5"/><path d="M14 12.5L26 20L62 21.5"/></g>
          <g class="blade blade-b"><circle cx="9" cy="31" r="6.5"/><path d="M14 27.5L26 20L62 18.5"/></g>
          <circle class="pivot" cx="26" cy="20" r="1.8"/>
        </svg>
      </div>
    </div>
    <div class="c-bottom">
      <div class="c-dots" id="c-dots" aria-hidden="true"></div>
    </div>
  </div>

  <div class="page" id="page">
    <header class="top" id="top">
      <h1 class="wordmark head-wm"><span class="fit">Gallery</span></h1>
      <div class="top-row">
        <nav class="links" aria-label="Main">
          <a href="#pile">Works</a>
          <a href="#index">Index</a>
        </nav>
        <p class="serif" id="count-serif"></p>
      </div>
    </header>

    <main>
      <!-- The stack of paintings -->
      <section class="stage" id="pile" aria-label="Paintings">
        <p class="mono side side-left">Local time<br><span id="clock">--:--:--</span></p>

        <div class="panel">
          <ul class="pile is-waiting" id="pile-cards"></ul>
          <div class="panel-ui">
            <span class="mono" id="pile-label" aria-live="polite"></span>
            <button class="mono ghost" id="shuffle" type="button">
              Shuffle
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3M18 3v4h-4M6 21v-4h4"/></svg>
            </button>
          </div>
        </div>

        <p class="mono side side-right"><span class="diamond" aria-hidden="true"></span><span id="on-view"></span></p>
      </section>

      <!-- Index -->
      <section class="index" id="index" aria-labelledby="index-title">
        <div class="index-head">
          <h2 class="mono" id="index-title">[ Index ]</h2>
          <div class="toggle mono" role="group" aria-label="Layout">
            <button type="button" data-view="list" aria-pressed="true">List</button>
            <button type="button" data-view="grid" aria-pressed="false">Grid</button>
          </div>
        </div>
        <ol class="items" id="items" data-view="list"></ol>
      </section>
    </main>

    <footer class="foot">
      <div class="foot-row mono">
        <span>&copy; <span id="year"></span></span>
        <a href="#top">Back to top <span aria-hidden="true">&#9650;</span></a>
      </div>
      <div class="foot-line" aria-hidden="true">
        <svg class="scissors" viewBox="0 0 64 40">
          <g class="blade blade-a"><circle cx="9" cy="9" r="6.5"/><path d="M14 12.5L26 20L62 21.5"/></g>
          <g class="blade blade-b"><circle cx="9" cy="31" r="6.5"/><path d="M14 27.5L26 20L62 18.5"/></g>
          <circle class="pivot" cx="26" cy="20" r="1.8"/>
        </svg>
      </div>
      <p class="wordmark" aria-hidden="true"><span class="fit">Gallery</span></p>
    </footer>
  </div>

  <img class="preview" id="preview" alt="" aria-hidden="true">

  <dialog class="lightbox" id="lightbox" aria-label="Painting viewer">
    <div class="lb-stage" id="lb-stage">
      <img class="lb-img" id="lb-img" alt="" draggable="false">
    </div>
    <p class="mono lb-count" id="lb-count"></p>
    <p class="lb-title" id="lb-title"></p>
    <p class="mono lb-hint">Click to zoom</p>

    <button class="lb-btn lb-close" id="lb-close" aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <button class="lb-btn lb-prev" id="lb-prev" aria-label="Previous painting">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
    </button>
    <button class="lb-btn lb-next" id="lb-next" aria-label="Next painting">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </dialog>

  <script src="paintings.js"></script>
  <script src="script.js"></script>
</body>
</html>
